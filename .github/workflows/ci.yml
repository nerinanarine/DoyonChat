name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            functions:
              - 'functions/**'
            infra:
              - 'infra/**'
            workflows:
              - '.github/workflows/**'

  test-functions:
    needs: changes
    if: needs.changes.outputs.functions == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    env:
      COSMOSDB_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand

  validate-infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bicep Build (Syntax Validation)
        run: |
          echo "🔧 Installing Bicep CLI..."
          az bicep install
          echo "🔍 Validating Bicep syntax..."
          az bicep build --file infra/main.bicep
          echo "✅ Bicep syntax check passed"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Deployment (What-If)
        env:
          AGENT_AUTH_TENANT: ${{ secrets.AGENT_AUTH_TENANT || '' }}
          AGENT_AUTH_AUDIENCE: ${{ secrets.AGENT_AUTH_AUDIENCE || '' }}
        run: |
          echo "🔍 Running deployment validation..."
          test -n "$AGENT_AUTH_TENANT" || { echo "::error::AGENT_AUTH_TENANT is required (Bicep now requires gateway auth tenant)"; exit 1; }
          test -n "$AGENT_AUTH_AUDIENCE" || { echo "::error::AGENT_AUTH_AUDIENCE is required (Bicep now requires gateway auth audience)"; exit 1; }
          az deployment group validate \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/prod.parameters.json \
            openCodeGoApiKey=${{ secrets.OPENCODE_GO_API_KEY }} \
            cosmosDbKey=${{ secrets.COSMOSDB_KEY }} \
            agentAuthTenant="$AGENT_AUTH_TENANT" \
            agentAuthAudience="$AGENT_AUTH_AUDIENCE" \
            agentEnabled="${{ vars.AGENT_ENABLED || 'false' }}"
          echo "✅ Deployment validation passed"
